<!doctype html>
<html lang=en>
    <head>
        <meta charset=utf-8>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, minimum-scale=0.5">
        <title>ic3.systems</title>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
            * {
                margin: 0;
                border: 0;
                padding: 0;
                font-family: sans-serif;
            }
            :root {
                --scroll: 0;
                --base-size: calc( 10px + 0.5vh + 0.5vw );
                --title-size: calc( 10px + 2vh + 2vw );
            }
            html {
                min-height: 100vh;
            }
            body {
                min-height: 100vh;
            }
            body > div {
                max-width: calc( 160px + 40vw );
                margin: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: start;
            }
            h1 {
                margin-top: calc( var(--base-size) * 4 );
                font-family: "Archivo Black", sans-serif;
                font-size: var(--title-size);
                position: relative;
            }
            h1:before {
                position: absolute;
                z-index: -1;
                content: "";
                width: 110%;
                left: -5%;
                height: 100%;
                top: calc( var(--scroll) * -0.15vh );
                opacity: calc( ( 32 - var(--scroll) ) / 64 );
                border-bottom: 0.2em solid #000;
            }
            ul {
                padding: calc( var(--base-size) * 4 );
                list-style-position: inside;
            }
            li {
                padding: calc( var(--base-size) * 2 );
                position: relative;
                font-size: var(--base-size);
                --mouse-x: 0;
                --mouse-y: 0;
            }
            li:hover {
                cursor: pointer;
            }
            li:before {
                position: absolute;
                z-index: -1;
                content: "";
                top: 25%;
                left: 25%;
                width: 50%;
                height: 50%;
                background-color: rgba( 0,0,0,0.0 );
                transition: background-color 2s, transform 2s;
            }
            li:hover:before {
                transform: translate( calc( var(--mouse-x) * -1% ), calc( var(--mouse-y) * -1% ))
                           skew( calc( var(--mouse-x) * 1deg ), calc( var(--mouse-y) * 1deg ));
                background-color: rgba( 0,0,0,0.1 );
            }
        </style>

    </head>
    <body>
        <div>
            <h1>IC3.SYSTEMS</h1>
            <ul>
                <li class="track-pointer">Lorem ipsum</li>
                <li class="track-pointer">Dolor sit amet</li>
                <li class="track-pointer">Consectetur adipiscing elit</li>
                <li class="track-pointer">Sed do eiusmod</li>
            </ul>
        </div>
    </body>

    <script>
        window.addEventListener( 'scroll', () => {
            document.documentElement.style.setProperty( '--scroll', ( window.scrollY / window.innerHeight * 100 ));
        });

        document.querySelectorAll( '.track-pointer' ).forEach( element => {
            element.addEventListener( 'mousemove', event => {
                boundingRect = element.getBoundingClientRect();
                element.style.setProperty( '--mouse-x', ( event.offsetX / boundingRect.width * 100 - 50 ));
                element.style.setProperty( '--mouse-y', ( event.offsetY / boundingRect.height * 100 - 50 ));
            });
        });
    </script>
</html>
